name: Lint and Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        run: go tool golangci-lint run --disable=errcheck

  go-fix:
    name: go fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go fix
        run: go fix -diff ./...

  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -v -vet=all -race ./...

  formal-verification:
    name: formal verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Menu sync model check
        run: .cursor/skills/verify-menu-sync/scripts/check-menu-sync
      - name: Menu locks model check
        run: .cursor/skills/verify-menu-locks/scripts/check-menu-locks
